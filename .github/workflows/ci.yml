name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 快速反馈：类型检查 + lint
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # 多平台产物：Linux 静态 musl / Windows / macOS，外加 aarch64（远端 Termux 用）
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, name: linux-x86_64 }
          # aarch64 用 musl + rust-lld 产出纯静态 ELF（无 ld-*.so interpreter）
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, name: linux-aarch64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, name: windows-x86_64 }
          - { target: aarch64-apple-darwin, os: macos-latest, name: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装 musl 工具链
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          # aarch64-musl 无系统交叉 gcc：ring 的 C 部分用 clang 交叉编译，链接走 rust-lld
          CC_aarch64_unknown_linux_musl: clang
          CFLAGS_aarch64_unknown_linux_musl: --target=aarch64-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: ncm-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/ncm
            target/${{ matrix.target }}/release/ncm.exe

  # 打 tag 时创建 Release 并附带产物
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 不 merge：按 artifact 目录保留平台名，避免同名 ncm 互相覆盖
      - uses: actions/download-artifact@v4
      - run: |
          mkdir -p dist
          for d in ncm-*/; do
            plat=${d#ncm-}; plat=${plat%/}
            for f in "$d"*; do
              base=$(basename "$f")
              case "$base" in
                *.exe) cp "$f" "dist/ncm-${plat}.exe" ;;
                *) cp "$f" "dist/ncm-${plat}" ;;
              esac
            done
          done
          cd dist && for f in *; do case "$f" in *.exe) ;; *) gzip -kf "$f";; esac; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
